<section class="page page-standard settings-page" data-page="settings" aria-labelledby="settings-title">
    {% include 'core/partials/settings_nav.html' with section='information' %}
    <div class="settings-grid">
        <section class="settings-card version-information" data-version-information>
            <h2>Version Information</h2>
            <div class="version-info-content">
                <p>Your Release <a href="{{ current_release_url }}" target="_blank" rel="noopener noreferrer">{{ current_release_tag }}</a></p>
                <p>Latest Release <a href="{{ releases_url }}" target="_blank" rel="noopener noreferrer" data-latest-release>View releases</a></p>
                <p class="version-status"><a href="{{ releases_url }}" target="_blank" rel="noopener noreferrer" data-version-status hidden></a></p>
            </div>
            <div class="version-support-links">
                <a href="{{ issues_url }}" target="_blank" rel="noopener noreferrer">Report an issue</a>
                <a href="{{ discussions_url }}" target="_blank" rel="noopener noreferrer">Ask a question</a>
            </div>
        </section>
    </div>
</section>
