{% load static %}
<section
    class="page page-map"
    data-page="map"
    data-map-style-url="{{ map_style_url }}"
    data-map-glyphs-url="{{ map_glyphs_url }}"
    data-country-metadata-url="{% url 'countries:metadata' %}"
    data-country-news-url-template="{% url 'news:country_news' iso2='COUNTRY_CODE' %}"
    data-country-videos-url-template="{% url 'news:country_videos' iso2='COUNTRY_CODE' %}"
    data-country-geometry-url="{% static 'data/countries.geojson' %}"
    data-capital-geometry-url="{% static 'data/capitals.geojson' %}"
    aria-labelledby="map-title"
>
    <h1 id="map-title" class="visually-hidden">Map</h1>
    <div class="map-workspace">
        <div id="world-map" class="world-map" role="application" aria-label="Interactive world map" tabindex="0"></div>
        <div class="map-toolbar" aria-label="Map controls">
            <div class="map-toolbar-actions">
                <button type="button" class="map-command" data-home-view disabled>Home</button>
                <button type="button" class="map-command" data-world-view>World</button>
                <button
                    type="button"
                    class="map-command"
                    data-map-controls-toggle
                    aria-expanded="false"
                    aria-controls="map-display-controls"
                >Display</button>
            </div>
            <div id="map-display-controls" class="map-display-controls" data-map-controls-panel hidden>
                <fieldset>
                    <legend>Map display</legend>
                    <label><input type="checkbox" data-map-preference="terrain"> Terrain</label>
                    <label><input type="checkbox" data-map-preference="countryNames"> Country names</label>
                    <label><input type="checkbox" data-map-preference="capitalNames"> Capital names</label>
                    <label><input type="checkbox" data-map-preference="allOtherText"> All other text</label>
                </fieldset>
                <p class="map-home-summary" data-home-summary></p>
            </div>
        </div>
        <div class="map-status" data-map-status role="status" aria-live="polite">
            Loading map and country boundaries…
        </div>
        <p class="map-notice" data-map-notice role="status" aria-live="polite" hidden></p>

        <aside class="country-drawer" data-country-drawer aria-labelledby="country-name" tabindex="-1" hidden>
            <button class="country-drawer-close" type="button" data-country-close aria-label="Close country details" title="Close country details">×</button>
            <div class="country-heading">
                <span class="country-flag" aria-hidden="true">
                    <img data-country-flag alt="" referrerpolicy="no-referrer" hidden>
                    <span data-country-flag-fallback></span>
                </span>
                <h2 id="country-name" data-country-name></h2>
            </div>
            <dl class="country-identity">
                <div>
                    <dt>Region</dt>
                    <dd data-country-region></dd>
                </div>
                <div>
                    <dt>Subregion</dt>
                    <dd data-country-subregion></dd>
                </div>
            </dl>
            <section class="country-news" aria-labelledby="country-news-title">
                <div class="country-news-heading">
                    <p class="eyebrow">Current coverage</p>
                    <h3 id="country-news-title">Latest news</h3>
                </div>
                <div class="country-content-tabs" role="tablist" aria-label="Country coverage">
                    <button type="button" role="tab" id="country-articles-tab" aria-controls="country-articles-panel" aria-selected="true" tabindex="0" data-country-section="articles">Articles</button>
                    <button type="button" role="tab" id="country-videos-tab" aria-controls="country-videos-panel" aria-selected="false" tabindex="-1" data-country-section="videos">Videos</button>
                </div>
                <div id="country-articles-panel" role="tabpanel" aria-labelledby="country-articles-tab" data-country-section-panel="articles">
                    <div data-country-news-content aria-live="polite" aria-busy="true">
                        <p class="country-news-message">Loading current English-language headlines…</p>
                    </div>
                </div>
                <div id="country-videos-panel" role="tabpanel" aria-labelledby="country-videos-tab" data-country-section-panel="videos" hidden>
                    <div data-country-videos-content aria-live="polite" aria-busy="false"></div>
                </div>
            </section>
        </aside>

        <noscript>
            <p class="map-fallback">JavaScript is required for the interactive map. Journal and Settings navigation remain available.</p>
        </noscript>
    </div>
</section>
