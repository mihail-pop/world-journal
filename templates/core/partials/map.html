{% load static %}
<section
    class="page page-map"
    data-page="map"
    data-map-style-url="{{ map_style_url }}"
    data-map-glyphs-url="{{ map_glyphs_url }}"
    data-country-metadata-url="{% url 'countries:metadata' %}"
    data-country-geometry-url="{% static 'data/countries.geojson' %}"
    data-capital-geometry-url="{% static 'data/capitals.geojson' %}"
    data-terrain-available="{{ map_terrain.available|yesno:'true,false' }}"
    data-terrain-unavailable-reason="{{ map_terrain.reason }}"
    aria-labelledby="map-title"
>
    <h1 id="map-title" class="visually-hidden">Map</h1>
    <div class="map-workspace">
        <div id="world-map" class="world-map" role="application" aria-label="Interactive world map" tabindex="0"></div>
        <div class="map-toolbar" aria-label="Map controls">
            <div class="map-toolbar-actions">
                <button type="button" class="map-command" data-home-view disabled>Home</button>
                <button type="button" class="map-command" data-world-view>World</button>
                <button
                    type="button"
                    class="map-command"
                    data-map-controls-toggle
                    aria-expanded="false"
                    aria-controls="map-display-controls"
                >Display</button>
            </div>
            <div id="map-display-controls" class="map-display-controls" data-map-controls-panel hidden>
                <fieldset>
                    <legend>Map display</legend>
                    <label><input type="checkbox" data-map-preference="countryNames"> Country names</label>
                    <label><input type="checkbox" data-map-preference="capitalNames"> Capital names</label>
                    <label><input type="checkbox" data-map-preference="water"> Water</label>
                    <label>
                        <input type="checkbox" data-map-preference="terrain">
                        Terrain
                        <span class="control-note" data-terrain-note>{{ map_terrain.reason }}</span>
                    </label>
                    <label><input type="checkbox" data-map-preference="simpleMode"> Simple mode</label>
                </fieldset>
                <p class="map-home-summary" data-home-summary></p>
            </div>
        </div>
        <div class="map-status" data-map-status role="status" aria-live="polite">
            Loading map and country boundaries…
        </div>
        <p class="map-notice" data-map-notice role="status" aria-live="polite" hidden></p>

        <aside class="country-drawer" data-country-drawer aria-labelledby="country-name" tabindex="-1" hidden>
            <button class="country-drawer-close" type="button" data-country-close aria-label="Close country details" title="Close country details">×</button>
            <p class="eyebrow">Country identity</p>
            <div class="country-heading">
                <span class="country-flag" data-country-flag aria-hidden="true"></span>
                <div>
                    <h2 id="country-name" data-country-name></h2>
                    <p class="country-code" data-country-code></p>
                </div>
            </div>
            <dl class="country-identity">
                <div>
                    <dt>Region</dt>
                    <dd data-country-region></dd>
                </div>
                <div>
                    <dt>Subregion</dt>
                    <dd data-country-subregion></dd>
                </div>
            </dl>
        </aside>

        <noscript>
            <p class="map-fallback">JavaScript is required for the interactive map. Journal and Settings navigation remain available.</p>
        </noscript>
    </div>
</section>
