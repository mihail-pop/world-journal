{% load static %}
<!doctype html>
<html lang="en" data-theme="dark" data-app-name="{{ app_display_name }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>{{ active_page|title }} | {{ app_display_name }}</title>
    <script>
        try {
            const savedTheme = localStorage.getItem("world-journal:theme");
            if (["dark", "light", "brown"].includes(savedTheme)) {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (error) {
            // The dark root palette remains the fallback when storage is unavailable.
        }
    </script>
    <link rel="stylesheet" href="{% static 'vendor/maplibre-gl/maplibre-gl.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="{% static 'css/ui.css' %}">
    <script src="{% static 'vendor/htmx/htmx-2.0.8.min.js' %}" defer></script>
    <script type="module" src="{% static 'js/app.js' %}"></script>
</head>
<body hx-ext="page-memory" data-news-cache-url="{% url 'news:cached_drawers' %}">
    <header class="app-header">
        <a class="app-name" href="{% url 'core:map' %}" aria-label="{{ app_display_name }} map">{{ app_display_name }}</a>
        <nav class="primary-nav" aria-label="Primary" hx-boost="true" hx-target="#app-content" hx-push-url="true" hx-swap="innerHTML show:top">
            <a data-nav-page="map" href="{% url 'core:map' %}"{% if active_page == 'map' %} aria-current="page"{% endif %}>Map</a>
            <a data-nav-page="news" href="{% url 'news:index' %}"{% if active_page == 'news' %} aria-current="page"{% endif %}>News</a>
            <a data-nav-page="journal" href="{% url 'core:journal' %}"{% if active_page == 'journal' %} aria-current="page"{% endif %}>Journal</a>
        </nav>
        <div class="header-actions">
            <a class="settings-link" data-nav-page="settings" href="{% url 'core:settings' %}"{% if active_page == 'settings' %} aria-current="page"{% endif %} hx-boost="true" hx-target="#app-content" hx-push-url="true" hx-swap="innerHTML show:top">Settings</a>
            <button class="player-toggle" type="button" data-player-toggle aria-controls="persistent-player" aria-expanded="false" aria-label="Restore video player" title="Restore player" hidden>Player</button>
        </div>
    </header>

    <main id="app-content" tabindex="-1" hx-history-elt hx-history="false">
        {% include page_template %}
    </main>

    <aside id="persistent-player" class="persistent-player" aria-label="Video player" data-player-state="empty">
        <div class="player-heading">
            <div>

                <p class="player-title" data-player-title>No video selected</p>
                <p class="player-channel" data-player-channel></p>
            </div>
            <div class="player-actions" data-player-actions hidden>
                <button type="button" data-player-minimize aria-label="Minimize video player" title="Minimize"><span data-player-minimize-icon>{% include 'core/partials/icon.html' with name='minimize' %}</span><span data-player-restore-icon hidden>{% include 'core/partials/icon.html' with name='restore' %}</span></button>
                <button type="button" data-player-close aria-label="Close video player" title="Close">{% include 'core/partials/icon.html' with name='close' %}</button>
            </div>
        </div>
        <div class="player-stage" data-player-stage></div>
    </aside>
    <template data-control-icon="down">{% include 'core/partials/icon.html' with name='down' %}</template>
    <template data-control-icon="close">{% include 'core/partials/icon.html' with name='close' %}</template>
</body>
</html>
