<span class="journal-bookmark-actions">
    <a class="news-save-journal{% if card.bookmark %} is-saved{% endif %}" href="{% if card.bookmark %}{{ card.bookmark.edit_url }}{% else %}{{ card.save_url }}{% endif %}" data-bookmark-url="{{ card.save_url }}" data-bookmark-checked data-saved-entry="{{ card.bookmark.entry_id }}" data-saved-edit-url="{{ card.bookmark.edit_url }}" data-saved-delete-url="{{ card.bookmark.delete_url }}" hx-boost="{% if card.bookmark %}false{% else %}true{% endif %}" hx-target="#app-content" hx-push-url="true" {% if card.bookmark %}role="button" aria-label="Remove from Journal"{% endif %}>{% if card.bookmark %}{% include 'core/partials/icon.html' with name='check' %} Saved{% else %}{% include 'core/partials/icon.html' with name='bookmark' %} Save{% endif %}</a>
    <button class="journal-quick-save" type="button" data-journal-quick-save aria-label="Quick Save" title="Quick Save" {% if card.bookmark %}hidden{% endif %}>{% include 'core/partials/icon.html' with name='plus-small' %}</button>
</span>
