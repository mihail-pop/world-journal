<div class="country-videos-result" data-country-videos-result data-video-country="{{ country_code }}" data-feed-pending="{{ feed_pending|yesno:'true,false' }}">
    <div data-news-collection data-news-version="{{ paging_version }}" data-news-query="{{ query_signature }}" data-news-refresh-url="{{ refresh_url }}">
        {% if cards %}
            <ol class="country-video-list" data-news-items>
                {% for card in cards %}{% include 'news/partials/country_video.html' with item=card.item %}{% endfor %}
            </ol>
            {% include 'news/partials/load_more.html' %}
        {% elif not enabled_count %}<p class="country-news-message">No video channels are enabled.</p>
        {% else %}<p class="country-news-message">No videos for this country yet.</p>{% endif %}
    </div>
</div>
