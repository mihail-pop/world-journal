<section class="page page-standard news-page" data-page="news" data-news-board aria-label="News">
    <div class="news-toolbar">
    <nav class="news-board-tabs" aria-label="News type" hx-boost="true" hx-target="#app-content" hx-push-url="true" hx-swap="innerHTML show:top">
        <a href="{{ articles_url }}" {% if tab == 'articles' %}aria-current="page"{% endif %}>Articles</a>
        <a href="{{ videos_url }}" {% if tab == 'videos' %}aria-current="page"{% endif %}>Videos</a>
    </nav>
    <form class="news-board-filters" method="get" action="{% url 'news:index' %}" hx-get="{% url 'news:index' %}" hx-target="[data-news-board-results]" hx-headers='{"X-News-Filtering":"1"}' hx-push-url="true" hx-swap="innerHTML" hx-sync="this:replace" data-news-board-filters>
        <input type="hidden" name="tab" value="{{ tab }}">
        <div class="news-source-filter">
            <label class="visually-hidden" for="news-source">{% if tab == 'videos' %}Channels{% else %}Sources{% endif %}</label>
            <select name="source" id="news-source" multiple data-inline-select data-select-placeholder="{% if tab == 'videos' %}Channels{% else %}Sources{% endif %}">{% for value,label in options.sources %}<option value="{{ value }}" {% if value in options.source %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
        </div>
        {% if tab == 'articles' %}<div class="news-coverage-filter"><label class="visually-hidden" for="news-country">Google coverage</label><select name="country" id="news-country" data-country-select><option value="WORLD" {% if options.country == 'WORLD' %}selected{% endif %}>Google: World</option>{% for country in countries %}<option value="{{ country.iso_a2 }}" {% if options.country == country.iso_a2 %}selected{% endif %}>{{ country.name }}</option>{% endfor %}</select></div>{% else %}<input type="hidden" name="country" value="{{ options.country }}">{% endif %}
        <div class="news-period-filter"><label class="visually-hidden" for="news-period">Published</label><select name="period" id="news-period"><option value="day" {% if options.period == 'day' %}selected{% endif %}>Past 24 hours</option><option value="week" {% if options.period == 'week' %}selected{% endif %}>Past 7 days</option><option value="month" {% if options.period == 'month' %}selected{% endif %}>Past 1 month</option><option value="all" {% if options.period == 'all' %}selected{% endif %}>{% if tab == 'videos' %}All Videos{% else %}All Articles{% endif %}</option></select></div>
        <input type="hidden" name="sort" value="{{ options.sort }}">
        <button class="news-sort-order" type="button" data-news-sort data-order="{{ options.sort_order }}" data-next="{{ options.sort_next }}" title="{{ options.sort_label }}" aria-label="Sort: {{ options.sort_label }}"></button>
        <label class="visually-hidden" for="news-search">{% if tab == 'videos' %}Search videos{% else %}Search articles{% endif %}</label>
        <input class="news-search" type="search" id="news-search" name="q" value="{{ options.q }}" maxlength="200" placeholder="{% if tab == 'videos' %}Search video..{% else %}Search article..{% endif %}" aria-label="{% if tab == 'videos' %}Search videos{% else %}Search articles{% endif %}" autocomplete="off" data-news-search>
        <noscript><button class="journal-button" type="submit">Apply</button></noscript>
    </form>
    </div>
    <div data-news-board-results aria-live="polite" aria-atomic="false">{% include 'news/partials/board_results.html' %}</div>
</section>
