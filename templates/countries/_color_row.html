<fieldset class="preset-color-row" data-preset-row>
    <legend class="visually-hidden">Color group</legend>
    {{ color_form.non_field_errors }}
    <div class="preset-group-heading">
        <div class="preset-group-title">{{ color_form.title }}{{ color_form.title.errors }}</div>
        <label class="preset-group-remove" title="Remove or restore group">
            {{ color_form.DELETE }}
            <span class="preset-remove-label">Remove</span><span class="preset-restore-label">Restore</span>
        </label>
    </div>
    <div class="preset-group-content">
        {% include 'countries/_preset_color.html' with field=color_form.color %}
        {% include 'journal/_field.html' with field=color_form.countries %}
    </div>
</fieldset>
