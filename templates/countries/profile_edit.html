<section class="page page-standard journal-page" data-page="journal" hx-boost="true" hx-target="#app-content" hx-push-url="true" aria-labelledby="country-profile-title"><a class="journal-back-link" href="{% url 'core:map' %}?country={{ country.pk }}&amp;section=notes">← {{ country.name }}</a><div class="page-copy"><p class="eyebrow">Country overview</p><h1 id="country-profile-title">{{ country.name }}</h1><p>Feature a Journal entry in this country's Notes tab. Edit its text and upload pictures through the Journal.</p></div><form method="post" class="journal-editor">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}{% include 'journal/_field.html' %}{% endfor %}<button class="journal-button is-primary" type="submit">Save selection</button></form><form method="post" action="{% url 'countries:profile_create' country.pk %}" class="country-create-overview">{% csrf_token %}<button class="journal-button" type="submit">{% if form.instance.entry_id %}Edit overview note{% else %}Create overview note{% endif %}</button></form></section>
