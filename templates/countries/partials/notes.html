<div class="country-notes" data-country-notes-result="{{ country.pk }}" hx-boost="true" hx-target="#app-content" hx-push-url="true">
    <section class="country-notes-research">
        <div class="country-notes-heading"><h4>Saved items</h4><div class="country-notes-actions"><a class="journal-button" href="{% url 'core:journal' %}?country={{ country.pk }}">View all</a><a class="journal-button" href="{% url 'journal:new' %}?country={{ country.pk }}">Add</a></div></div>
        {% if recent_entries %}<ul class="country-saved-research">{% for entry in recent_entries %}<li><a href="{{ entry.get_absolute_url }}">{{ entry.title }}</a><span>{{ entry.get_entry_type_display }} · {{ entry.created_at|date:'M j, Y' }}</span></li>{% endfor %}</ul>{% endif %}
    </section>
</div>
