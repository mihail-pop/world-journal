<fieldset class="journal-editor-section" data-journal-section data-editor-page="{{ section_form.prefix }}" hidden>
    <legend class="visually-hidden">Subsection</legend>
    {% for hidden in section_form.hidden_fields %}{{ hidden }}{% endfor %}{{ section_form.non_field_errors }}
    <div class="journal-section-deleted" hidden><p>Section marked for removal. Save to confirm.</p><button type="button" class="journal-button" data-section-remove>Undo removal</button></div>
    <div class="journal-section-fields">{% include 'journal/_content_fields.html' with content_form=section_form is_main=False %}</div>
    <label class="visually-hidden">{{ section_form.DELETE }} Remove when saving</label>
</fieldset>
