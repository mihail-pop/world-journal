<fieldset class="journal-section-card" data-journal-section>
    <legend class="visually-hidden">Subsection</legend>
    {% for hidden in section_form.hidden_fields %}{{ hidden }}{% endfor %}{{ section_form.non_field_errors }}
    <div class="journal-section-actions"><button type="button" data-section-move="up" aria-label="Move section up" title="Move up">{% include 'core/partials/icon.html' with name='up' %}</button><button type="button" data-section-move="down" aria-label="Move section down" title="Move down">{% include 'core/partials/icon.html' with name='down' %}</button><button type="button" data-section-remove title="Remove or undo removal">Remove / undo</button></div>
    <p class="journal-section-deleted" hidden>Marked for removal. Save to confirm, or undo.</p>
    <details class="journal-section-fields" {% if not section_form.instance.pk or section_form.errors %}open{% endif %}><summary><span data-section-caption>{{ section_form.title.value|default:'Untitled section' }}</span></summary>{% include 'journal/_content_fields.html' with content_form=section_form %}</details>
    <label class="journal-delete-field">{{ section_form.DELETE }} Remove when saving</label>
</fieldset>
