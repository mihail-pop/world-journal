<div class="journal-field journal-field-wide"><label for="journal-search">Search</label><input id="journal-search" type="search" name="q" value="{{ filters.q }}" placeholder="Titles, notes, subsections or source links"></div>
<div class="journal-field"><label for="journal-collection">Collection</label><select id="journal-collection" name="collection"><option value="">All collections</option><option value="unfiled" {% if filters.collection == 'unfiled' %}selected{% endif %}>Unfiled</option>{% for collection in collections %}<option value="{{ collection.pk }}" {% if filters.collection == collection.pk|stringformat:'s' %}selected{% endif %}>{{ collection.name }}</option>{% endfor %}</select></div>
<div class="journal-field"><label for="journal-type">Entry type</label><select id="journal-type" name="type"><option value="">All types</option>{% for value,label in entry_types %}<option value="{{ value }}" {% if filters.type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="journal-field"><label for="journal-date-basis">Date basis</label><select id="journal-date-basis" name="date_basis"><option value="event" {% if filters.date_basis != 'created' %}selected{% endif %}>Event date</option><option value="created" {% if filters.date_basis == 'created' %}selected{% endif %}>Created date</option></select></div>
{% if is_statistics %}<div class="journal-field"><label for="statistics-period">Group activity by</label><select id="statistics-period" name="period"><option value="day" {% if period == 'day' %}selected{% endif %}>Day</option><option value="month" {% if period == 'month' %}selected{% endif %}>Month</option><option value="year" {% if period == 'year' %}selected{% endif %}>Year</option></select></div>{% endif %}
<div class="journal-field"><label for="journal-date">Exact day</label><input id="journal-date" type="date" name="date" value="{{ filters.date }}"></div>
<div class="journal-field"><label for="journal-year">Year</label><input id="journal-year" type="number" name="year" min="1" max="9999" value="{{ filters.year }}" placeholder="Any year"></div>
<div class="journal-field"><label for="journal-month">Month (1–12)</label><input id="journal-month" type="number" name="month" min="1" max="12" value="{{ filters.month }}" placeholder="Any month"></div>
<div class="journal-field journal-field-wide"><label for="journal-country">Countries</label><select id="journal-country" name="country" multiple size="5">{% for country in countries %}<option value="{{ country.pk }}" {% if country.pk in selected_countries %}selected{% endif %}>{{ country.name }}</option>{% endfor %}</select><p class="field-note">Select multiple with Ctrl/Cmd. Entries matching any selected country are included.</p></div>
<div class="journal-checkboxes">
    <label><input type="checkbox" name="favorite" value="1" {% if filters.favorite == '1' %}checked{% endif %}> Favorites</label>
    <label><input type="checkbox" name="pinned" value="1" {% if filters.pinned == '1' %}checked{% endif %}> Pinned</label>
    <label><input type="checkbox" name="undated" value="1" {% if filters.undated == '1' %}checked{% endif %}> Without event date</label>
    <label><input type="checkbox" name="untagged" value="1" {% if filters.untagged == '1' %}checked{% endif %}> Without country tags</label>
</div>
<p class="field-note journal-field-wide">An exact day takes precedence over year and month. “Without event date” always checks the entry's event date, including when you filter by created date.</p>
