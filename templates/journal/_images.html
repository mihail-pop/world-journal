<div class="journal-images">{% for image in images %}<figure><a href="{{ image.file.url }}" target="_blank" rel="noopener noreferrer" hx-boost="false"><img src="{{ image.file.url }}" alt="{{ image.caption|default:image.original_name }}" loading="lazy" width="{{ image.width }}" height="{{ image.height }}"></a><figcaption>{% if image.caption %}{{ image.caption }}{% else %}{{ image.original_name }}{% endif %} <a href="{% url 'journal:delete_attachment' entry.pk image.pk %}">Delete image</a></figcaption></figure>{% endfor %}</div>
