<div class="journal-embedded-video" data-journal-video {% if editable %}data-editable-video{% endif %} {% if main_video %}data-journal-main-video{% endif %} data-video-id="{{ content.youtube_video_id }}" data-video-title="{{ content.title }}" data-video-channel="{{ content.source_name }}" data-video-start="{{ content.youtube_start_seconds|default_if_none:0 }}" {% if editable or not content.youtube_video_id %}hidden{% endif %}>
    {% if editable %}
        <div class="journal-video-mount"><img data-journal-video-thumbnail loading="lazy" decoding="async" alt=""></div>
        <div class="journal-embedded-video-actions" data-journal-video-actions></div>
    {% else %}
        <div class="journal-video-mount" data-journal-video-mount></div>
    {% endif %}
</div>
